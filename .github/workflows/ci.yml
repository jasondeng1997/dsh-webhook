name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in `engines`; 22 is what the harness ships on.
        # Both are tested because the plugin is loaded into a host process rather
        # than imported by one — a version that only works on the maintainer's
        # machine is the failure this matrix exists to catch.
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck + unit tests + build + artifact shape assertions.
      - name: Check
        run: npm run check

      # `npm ci` already ran `prepare`, so lib/ exists here. Prove the built
      # bundle still satisfies the loader contract on its own, without relying on
      # the ordering above.
      - name: Verify artifacts
        run: node build.mjs --check
